apiVersion: v1
kind: Secret
metadata:
  name: docker-registry-secret
  namespace: default
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: <BASE64_ENCODED_DOCKER_CONFIG>
---
# Ejemplo de cómo generar el .dockerconfigjson:
# echo -n '{"auths":{"docker.io":{"username":"TU_USUARIO","password":"TU_PASSWORD","email":"TU_EMAIL","auth":"BASE64_USERNAME_PASSWORD"}}}' | base64 