---
apiVersion: v1
kind: ConfigMap
metadata:
  name: porfolio-config
  namespace: default
  labels:
    app: porfolio
data:
  NODE_ENV: 'production'
  PORT: '3001'
  LOG_LEVEL: 'info'
  SECURITY_HEADERS: 'true'
---
apiVersion: v1
kind: Secret
metadata:
  name: porfolio-secrets
  namespace: default
  labels:
    app: porfolio
type: Opaque
data:
  # Agregar secretos en base64 si es necesario
  # ejemplo: api-key: <base64-encoded-value>
---
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: porfolio-psp
  labels:
    app: porfolio
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'configMap'
  runAsUser:
    rule: 'MustRunAs'
    ranges:
      - min: 2001
        max: 2001
  runAsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 2001
        max: 2001
  seLinux:
    rule: 'RunAsAny'
  fsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 2001
        max: 2001
  readOnlyRootFilesystem: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: default
  name: porfolio-psp-user
rules:
  - apiGroups: ['policy']
    resources: ['podsecuritypolicies']
    verbs: ['use']
    resourceNames:
      - porfolio-psp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: porfolio-psp-binding
  namespace: default
roleRef:
  kind: Role
  name: porfolio-psp-user
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: default
    namespace: default
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: porfolio-ingress
  namespace: default
  labels:
    app: porfolio
  annotations:
    kubernetes.io/ingress.class: 'nginx'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/secure-backends: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: 'HTTP'
    # Headers de seguridad adicionales
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: geolocation=(), microphone=(), camera=()";
spec:
  tls:
    - hosts:
        - porfolio.tu-dominio.com # Cambiar por tu dominio
      secretName: porfolio-tls
  rules:
    - host: porfolio.tu-dominio.com # Cambiar por tu dominio
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: porfolio-service
                port:
                  number: 3001
