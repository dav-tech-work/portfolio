name: 'CodeQL Config'

# Configuración para análisis de seguridad con CodeQL
queries:
  # Queries de seguridad extendidas
  - uses: security-extended
  # Queries de seguridad y calidad
  - uses: security-and-quality
  # Queries personalizadas para Node.js
  - uses: security-and-quality/javascript-security-and-quality.qls

# Configuración específica para JavaScript/Node.js
paths:
  - src/
  - app.mjs
  - scripts/
  - test/

# Excluir archivos que no necesitan análisis
paths-ignore:
  - node_modules/
  - coverage/
  - logs/
  - uploads/
  - reports/
  - .nyc_output/
  - public/
  - views/
  - data/idiomas/

# Configuración de alertas
query-filters:
  - include:
      tags contain: security
  - include:
      tags contain: external/cwe/cwe-079
  - include:
      tags contain: external/cwe/cwe-089
  - include:
      tags contain: external/cwe/cwe-200
